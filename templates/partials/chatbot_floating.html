<!-- Chatbot Flottant - Assistant IA -->
<div id="chatbotContainer">
    <!-- Bouton d'ouverture -->
    <button class="chatbot-toggle" onclick="toggleChatbot()" id="chatbotToggle">
        <i class="fas fa-robot"></i>
        <span class="chatbot-badge" id="chatbotBadge">1</span>
    </button>
    
    <!-- Fenêtre du chatbot -->
    <div class="chatbot-popup" id="chatbotPopup" style="display: none;">
        <!-- En-tête -->
        <div class="chatbot-header">
            <div>
                <i class="fas fa-robot me-2"></i>
                <span>Assistant IA - Don de sang</span>
            </div>
            <div>
                <button class="btn-chat-minimize" onclick="minimizeChatbot()" title="Réduire">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="btn-chat-close" onclick="toggleChatbot()" title="Fermer">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        
        <!-- Corps des messages -->
        <div class="chatbot-body" id="chatbotBody">
            <div class="message bot">
                <div class="message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <div class="message-sender">Assistant</div>
                    <div class="message-text">
                        Bonjour ! 👋<br>
                        Je suis votre assistant pour le don de sang.<br>
                        Posez-moi vos questions sur :
                        <ul class="mt-2 mb-0" style="padding-left: 20px;">
                            <li>🩸 Le don de sang</li>
                            <li>📋 L'éligibilité</li>
                            <li>📍 Les centres de don</li>
                            <li>📅 Les rendez-vous</li>
                            <li>🩹 La compatibilité sanguine</li>
                        </ul>
                    </div>
                    <div class="message-time">À l'instant</div>
                </div>
            </div>
        </div>
        
        <!-- Zone de saisie -->
        <div class="chatbot-footer">
            <div class="quick-replies">
                <button class="quick-reply-btn" onclick="sendQuickMessage('Comment donner son sang ?')">
                    🩸 Don
                </button>
                <button class="quick-reply-btn" onclick="sendQuickMessage('Groupe sanguin compatible')">
                    🩹 Compatibilité
                </button>
                <button class="quick-reply-btn" onclick="sendQuickMessage('Prendre rendez-vous')">
                    📅 RDV
                </button>
                <button class="quick-reply-btn" onclick="sendQuickMessage('Où donner ?')">
                    📍 Centres
                </button>
            </div>
            <form id="chatbotForm" onsubmit="sendChatbotMessage(event)">
                {% csrf_token %}
                <div class="chat-input-group">
                    <input type="text" id="chatbotInput" placeholder="Posez votre question..." required>
                    <button type="submit" id="chatbotSendBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
            <div class="chatbot-typing" id="chatbotTyping">
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-text">L'assistant réfléchit...</span>
            </div>
        </div>
    </div>
</div>

<style>
/* ========== CHATBOT FLOATING STYLES ========== */
#chatbotContainer {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 9999;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Bouton d'ouverture */
.chatbot-toggle {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C41E3A, #8B1530);
    color: white;
    border: none;
    box-shadow: 0 6px 25px rgba(196, 30, 58, 0.5);
    cursor: pointer;
    font-size: 28px;
    transition: all 0.3s ease;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chatbot-toggle:hover {
    transform: scale(1.1) rotate(-10deg);
    box-shadow: 0 8px 35px rgba(196, 30, 58, 0.6);
}

.chatbot-toggle:active {
    transform: scale(0.95);
}

.chatbot-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #28a745;
    color: white;
    border-radius: 50%;
    padding: 2px 9px;
    font-size: 12px;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(40, 167, 69, 0.4);
    animation: pulse-badge 2s infinite;
}

@keyframes pulse-badge {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

/* Fenêtre popup */
.chatbot-popup {
    position: absolute;
    bottom: 85px;
    right: 0;
    width: 420px;
    height: 580px;
    max-height: 80vh;
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 60px rgba(0, 0, 0, 0.25);
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes slideUp {
    from { 
        opacity: 0; 
        transform: translateY(30px) scale(0.95);
    }
    to { 
        opacity: 1; 
        transform: translateY(0) scale(1);
    }
}

/* En-tête du chatbot */
.chatbot-header {
    padding: 16px 20px;
    background: linear-gradient(135deg, #C41E3A, #8B1530);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
}

.chatbot-header span {
    font-weight: 600;
    font-size: 16px;
}

.chatbot-header .btn-chat-close,
.chatbot-header .btn-chat-minimize {
    background: none;
    border: none;
    color: rgba(255,255,255,0.8);
    font-size: 18px;
    cursor: pointer;
    padding: 5px 10px;
    transition: all 0.3s;
    border-radius: 8px;
}

.chatbot-header .btn-chat-close:hover,
.chatbot-header .btn-chat-minimize:hover {
    background: rgba(255,255,255,0.2);
    color: white;
}

.chatbot-header .btn-chat-close {
    font-size: 20px;
}

/* Corps des messages */
.chatbot-body {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    background: #f8f9fa;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.chatbot-body::-webkit-scrollbar {
    width: 6px;
}

.chatbot-body::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 3px;
}

.chatbot-body::-webkit-scrollbar-thumb {
    background: #C41E3A;
    border-radius: 3px;
}

/* Messages */
.message {
    display: flex;
    gap: 10px;
    animation: fadeInMessage 0.3s ease;
}

@keyframes fadeInMessage {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.bot {
    justify-content: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.message-avatar {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C41E3A, #8B1530);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}

.message .message-content {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}

.message.bot .message-content {
    background: white;
    color: #333;
    border-bottom-left-radius: 4px;
}

.message.user .message-content {
    background: #C41E3A;
    color: white;
    border-bottom-right-radius: 4px;
}

.message .message-sender {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #6c757d;
}

.message.user .message-sender {
    color: rgba(255,255,255,0.8);
}

.message .message-text {
    word-wrap: break-word;
}

.message .message-text ul {
    font-size: 13px;
}

.message .message-time {
    font-size: 10px;
    color: #adb5bd;
    margin-top: 5px;
    text-align: right;
}

.message.user .message-time {
    color: rgba(255,255,255,0.6);
}

/* Pied de page */
.chatbot-footer {
    padding: 12px 16px 16px;
    border-top: 1px solid #e9ecef;
    background: white;
    flex-shrink: 0;
}

.quick-replies {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.quick-reply-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1.5px solid #C41E3A;
    background: white;
    color: #C41E3A;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.3s;
}

.quick-reply-btn:hover {
    background: #C41E3A;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(196, 30, 58, 0.2);
}

.chat-input-group {
    display: flex;
    gap: 10px;
    align-items: center;
}

.chat-input-group input {
    flex: 1;
    padding: 10px 16px;
    border: 2px solid #e9ecef;
    border-radius: 25px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s;
}

.chat-input-group input:focus {
    border-color: #C41E3A;
}

.chat-input-group button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #C41E3A, #8B1530);
    color: white;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chat-input-group button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(196, 30, 58, 0.3);
}

.chat-input-group button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

/* Indicateur de frappe */
.chatbot-typing {
    display: none;
    padding: 8px 0 0 0;
    align-items: center;
    gap: 8px;
}

.chatbot-typing.active {
    display: flex;
}

.typing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #C41E3A;
    animation: typingBounce 1.4s infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-8px); opacity: 1; }
}

.typing-text {
    font-size: 13px;
    color: #6c757d;
    margin-left: 4px;
}

/* Responsive */
@media (max-width: 576px) {
    #chatbotContainer {
        bottom: 15px;
        right: 15px;
    }
    
    .chatbot-toggle {
        width: 55px;
        height: 55px;
        font-size: 24px;
    }
    
    .chatbot-popup {
        width: calc(100vw - 30px);
        height: 500px;
        max-height: 70vh;
        right: -5px;
        bottom: 75px;
    }
    
    .quick-reply-btn {
        font-size: 11px;
        padding: 4px 10px;
    }
}

/* Minimized state */
.chatbot-popup.minimized {
    height: 60px;
}

.chatbot-popup.minimized .chatbot-body,
.chatbot-popup.minimized .chatbot-footer {
    display: none;
}
</style>

<script>
// ========== CHATBOT JAVASCRIPT ==========
let chatbotConversationId = null;
let isChatbotOpen = false;

// Obtenir le token CSRF
function getCsrfToken() {
    const cookieValue = document.cookie
        .split('; ')
        .find(row => row.startsWith('csrftoken='))
        ?.split('=')[1];
    return cookieValue || document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
}

// Ouvrir/Fermer le chatbot
function toggleChatbot() {
    const popup = document.getElementById('chatbotPopup');
    const toggle = document.getElementById('chatbotToggle');
    
    if (popup.style.display === 'none' || popup.style.display === '') {
        popup.style.display = 'flex';
        isChatbotOpen = true;
        document.getElementById('chatbotBadge').style.display = 'none';
        // Scroll en bas des messages
        setTimeout(() => {
            const body = document.getElementById('chatbotBody');
            body.scrollTop = body.scrollHeight;
        }, 100);
    } else {
        popup.style.display = 'none';
        isChatbotOpen = false;
    }
}

// Minimiser le chatbot
function minimizeChatbot() {
    const popup = document.getElementById('chatbotPopup');
    popup.classList.toggle('minimized');
}

// Envoyer un message
function sendChatbotMessage(e) {
    e.preventDefault();
    const input = document.getElementById('chatbotInput');
    const message = input.value.trim();
    if (!message) return;
    
    // Ajouter le message de l'utilisateur
    addChatbotMessage('user', message);
    input.value = '';
    input.disabled = true;
    document.getElementById('chatbotSendBtn').disabled = true;
    
    // Afficher l'indicateur de frappe
    showChatbotTyping();
    
    // Envoyer au serveur
    fetch('/chatbot/api/send/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken(),
        },
        body: JSON.stringify({
            message: message,
            conversation_id: chatbotConversationId,
        })
    })
    .then(response => response.json())
    .then(data => {
        hideChatbotTyping();
        input.disabled = false;
        document.getElementById('chatbotSendBtn').disabled = false;
        input.focus();
        
        if (data.success) {
            chatbotConversationId = data.conversation_id;
            addChatbotMessage('bot', data.bot_message.content);
        } else {
            addChatbotMessage('bot', 'Désolé, une erreur est survenue. Veuillez réessayer.');
        }
    })
    .catch(error => {
        hideChatbotTyping();
        input.disabled = false;
        document.getElementById('chatbotSendBtn').disabled = false;
        addChatbotMessage('bot', 'Erreur de connexion. Veuillez réessayer.');
        console.error('Chatbot error:', error);
    });
}

// Ajouter un message dans la fenêtre
function addChatbotMessage(sender, content) {
    const body = document.getElementById('chatbotBody');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${sender}`;
    
    const time = new Date().toLocaleTimeString('fr-FR', {
        hour: '2-digit',
        minute: '2-digit'
    });
    
    if (sender === 'bot') {
        messageDiv.innerHTML = `
            <div class="message-avatar">
                <i class="fas fa-robot"></i>
            </div>
            <div class="message-content">
                <div class="message-sender">Assistant</div>
                <div class="message-text">${content.replace(/\n/g, '<br>')}</div>
                <div class="message-time">${time}</div>
            </div>
        `;
    } else {
        messageDiv.innerHTML = `
            <div class="message-content">
                <div class="message-sender">Vous</div>
                <div class="message-text">${content.replace(/\n/g, '<br>')}</div>
                <div class="message-time">${time}</div>
            </div>
        `;
    }
    
    body.appendChild(messageDiv);
    body.scrollTop = body.scrollHeight;
}

// Envoyer un message rapide
function sendQuickMessage(message) {
    document.getElementById('chatbotInput').value = message;
    sendChatbotMessage(new Event('submit'));
}

// Afficher l'indicateur de frappe
function showChatbotTyping() {
    document.getElementById('chatbotTyping').classList.add('active');
    const body = document.getElementById('chatbotBody');
    body.scrollTop = body.scrollHeight;
}

// Masquer l'indicateur de frappe
function hideChatbotTyping() {
    document.getElementById('chatbotTyping').classList.remove('active');
}

// Fermer le chatbot en appuyant sur Echap
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && isChatbotOpen) {
        toggleChatbot();
    }
});

// Ouvrir le chatbot avec Ctrl+Shift+C
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'C') {
        e.preventDefault();
        toggleChatbot();
    }
});

// Initialiser - le badge disparaît après 5 secondes
setTimeout(() => {
    const badge = document.getElementById('chatbotBadge');
    if (badge) badge.style.display = 'none';
}, 5000);
</script>
