{% extends 'app_admin/base_admin.html' %}
{% load crispy_forms_tags %}

{% block admin_content %}
<div class="page-header">
    <h2><i class="fas fa-{% if action == 'create' %}plus{% else %}edit{% endif %} me-2 text-danger"></i>{{ title }}</h2>
    <a href="{% url 'app_admin:centres' %}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left"></i> Retour
    </a>
</div>

<div class="admin-card">
    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3">
            <button type="submit" class="btn btn-danger">
                <i class="fas fa-save me-2"></i>{% if action == 'create' %}Créer{% else %}Enregistrer{% endif %}
            </button>
            <a href="{% url 'app_admin:centres' %}" class="btn btn-outline-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
